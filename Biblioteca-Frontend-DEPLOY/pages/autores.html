<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Autores | Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/autores.css">

</head>

<body>

    <header class="bg-info text-white p-3">

        <div class="container">

            <h2>
                <i class="fa-solid fa-user-pen"></i>
                Gestión de Autores
            </h2>

        </div>

    </header>

    <div class="container mt-4">

        <div class="row mb-4 align-items-center">

            <div class="col-md-3">
                <h3>Listado de Autores</h3>
            </div>

            <div class="col-md-4">

                <input
                    type="text"
                    id="buscarAutor"
                    class="form-control"
                    placeholder="🔍 Buscar autor...">

            </div>

            <div class="col-md-3">

                <button
                    class="btn btn-info text-white w-100"
                    data-bs-toggle="modal"
                    data-bs-target="#modalAutor">

                    <i class="fa-solid fa-plus"></i>

                    Nuevo Autor

                </button>

            </div>

            <div class="col-md-2">

                <a
                    href="../index.html"
                    class="btn btn-secondary w-100">

                    <i class="fa-solid fa-house"></i>

                    Volver

                </a>

            </div>

        </div>

        <div class="card shadow">

            <div class="card-body">

                <table class="table table-striped table-hover align-middle">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Nacionalidad</th>
                            <th>Fecha de nacimiento</th>
                            <th>Acciones</th>

                        </tr>

                    </thead>

                    <tbody id="tablaAutores"></tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- Modal -->

    <div class="modal fade" id="modalAutor" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="tituloModal">
                        Agregar Autor
                    </h5>

                    <button
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <input
                        type="hidden"
                        id="idAutor">

                    <div class="mb-3">

                        <label>Nombre</label>

                        <input
                            id="nombre"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Nacionalidad</label>

                        <input
                            id="nacionalidad"
                            class="form-control">

                    </div>

                    <div class="mb-3">

                        <label>Fecha de nacimiento</label>

                        <input
                            id="fechaNacimiento"
                            type="date"
                            class="form-control">

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button
                        class="btn btn-primary"
                        id="guardarAutor">

                        Guardar

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/autores.js"></script>

</body>

</html>
