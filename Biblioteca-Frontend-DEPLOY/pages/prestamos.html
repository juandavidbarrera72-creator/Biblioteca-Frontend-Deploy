<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Préstamos | Biblioteca</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/prestamos.css">

</head>


<body>


<header class="bg-warning text-dark p-3">

    <div class="container">

        <h2>
            <i class="fa-solid fa-book-open-reader"></i>
            Gestión de Préstamos
        </h2>

    </div>

</header>



<div class="container mt-4">


    <div class="row mb-4 align-items-center">


        <div class="col-md-3">

            <h3>Listado de Préstamos</h3>

        </div>



        <div class="col-md-4">

            <input
                type="text"
                id="buscarPrestamo"
                class="form-control"
                placeholder="🔍 Buscar préstamo...">

        </div>



        <div class="col-md-3">

            <button
                class="btn btn-warning w-100"
                data-bs-toggle="modal"
                data-bs-target="#modalPrestamo">

                <i class="fa-solid fa-plus"></i>

                Nuevo Préstamo

            </button>

        </div>



        <div class="col-md-2">

            <a
                href="../index.html"
                class="btn btn-secondary w-100">

                <i class="fa-solid fa-house"></i>

                Volver

            </a>

        </div>


    </div>





    <div class="card shadow">


        <div class="card-body">


            <table class="table table-striped table-hover align-middle">


                <thead class="table-dark">


                    <tr>

                        <th>ID</th>
                        <th>Libro</th>
                        <th>Usuario</th>
                        <th>Fecha préstamo</th>
                        <th>Fecha devolución</th>
                        <th>Estado</th>
                        <th>Acciones</th>

                    </tr>


                </thead>


                <tbody id="tablaPrestamos"></tbody>


            </table>


        </div>


    </div>



</div>





<!-- MODAL -->


<div class="modal fade" id="modalPrestamo" tabindex="-1">


    <div class="modal-dialog">


        <div class="modal-content">


            <div class="modal-header">


                <h5 class="modal-title" id="tituloModal">

                    Agregar Préstamo

                </h5>



                <button
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>


            </div>





            <div class="modal-body">



                <input
                    type="hidden"
                    id="idPrestamo">





                <div class="mb-3">


                    <label>Libro</label>


                    <select
                        id="libro_id"
                        class="form-select">


                    </select>


                </div>





                <div class="mb-3">


                    <label>Usuario</label>


                    <select
                        id="usuario_id"
                        class="form-select">


                    </select>


                </div>





                <div class="mb-3">


                    <label>Fecha préstamo</label>


                    <input
                        id="fecha_prestamo"
                        type="date"
                        class="form-control">


                </div>





                <div class="mb-3">


                    <label>Fecha devolución</label>


                    <input
                        id="fecha_devolucion"
                        type="date"
                        class="form-control">


                </div>





                <div class="mb-3">


                    <label>Estado</label>


                    <select
                        id="estado"
                        class="form-select">


                        <option value="Prestado">
                            Prestado
                        </option>


                        <option value="Devuelto">
                            Devuelto
                        </option>


                    </select>


                </div>




            </div>





            <div class="modal-footer">


                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancelar

                </button>



                <button
                    class="btn btn-primary"
                    id="guardarPrestamo">

                    Guardar

                </button>



            </div>



        </div>


    </div>


</div>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>

<script src="../js/prestamos.js"></script>


</body>

</html>
