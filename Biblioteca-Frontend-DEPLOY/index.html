<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Biblioteca</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <!-- Encabezado -->
    <header class="bg-primary text-white p-3">
        <div class="container">
            <h2><i class="fa-solid fa-book"></i> Sistema de Biblioteca</h2>
        </div>
    </header>

    <!-- Menú -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">Inicio</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="pages/libros.html">Libros</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pages/usuarios.html">Usuarios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pages/autores.html">Autores</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="pages/prestamos.html">Préstamos</a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <!-- Contenido -->
    <main class="container mt-5">

        <div class="text-center">

            <h1>Bienvenido</h1>

            <p>
                Sistema de Gestión para Biblioteca
            </p>

        </div>

        <!-- Estado de conexión con el servidor -->
        <div id="estadoServidor" class="alert alert-secondary text-center">
            Comprobando conexión con el servidor...
        </div>

        <div class="row mt-4">

            <div class="col-md-3">

                <div class="card text-center shadow">

                    <div class="card-body">

                        <i class="fa-solid fa-book fa-3x text-primary"></i>

                        <h4 class="mt-3">Libros</h4>

                        <p class="display-6 mb-0" id="statLibros">–</p>

                        <a href="pages/libros.html"
                            class="btn btn-primary mt-3">

                            Administrar

                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card text-center shadow">

                    <div class="card-body">

                        <i class="fa-solid fa-users fa-3x text-success"></i>

                        <h4 class="mt-3">Usuarios</h4>

                        <p class="display-6 mb-0" id="statUsuarios">–</p>

                        <a href="pages/usuarios.html"
                            class="btn btn-success mt-3">

                            Administrar

                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card text-center shadow">

                    <div class="card-body">

                        <i class="fa-solid fa-user-pen fa-3x text-warning"></i>

                        <h4 class="mt-3">Autores</h4>

                        <p class="display-6 mb-0" id="statAutores">–</p>

                        <a href="pages/autores.html"
                            class="btn btn-warning mt-3">

                            Administrar

                        </a>

                    </div>

                </div>

            </div>

            <div class="col-md-3">

                <div class="card text-center shadow">

                    <div class="card-body">

                        <i class="fa-solid fa-right-left fa-3x text-danger"></i>

                        <h4 class="mt-3">Préstamos activos</h4>

                        <p class="display-6 mb-0" id="statPrestamos">–</p>

                        <a href="pages/prestamos.html"
                            class="btn btn-danger mt-3">

                            Administrar

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
